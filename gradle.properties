#Fuelio version — single source of truth for both platforms (docs/adr/0009-release-pipeline-and-versioning.md)
#GitHub's immutable-releases protection permanently locks a tag name the moment a Release is ever
#published under it, even after that Release and tag are deleted — v1.0.0 was published once during
#this pipeline's own debugging, so it can never be reused; every real bump lands here as a normal
#commit, same as any other change.
fuelio.versionName=1.0.1
fuelio.versionCode=2

#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.builtInKotlin=false
android.newDsl=false