#Fuelio version — single source of truth for both platforms (docs/adr/0009-release-pipeline-and-versioning.md)
#Nothing has shipped publicly yet, so the first release tag is v1.0.0-beta01; this property holds the
#bare semver the release pipeline's `validate` stage checks the tag against (beta/rc suffixes live only
#in the git tag, never here).
fuelio.versionName=1.0.0
fuelio.versionCode=1

#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.builtInKotlin=false
android.newDsl=false