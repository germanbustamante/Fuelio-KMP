name: Release

# Every push to master is a release: master only ever moves via an explicit development -> master
# pull request (docs/adr/0009-release-pipeline-and-versioning.md), so merging that PR is the release
# action — there is no separate tag to push by hand. The tag/GitHub Release name is derived from
# whatever `fuelio.versionName` already is at that commit; bumping it is a normal PR to development
# like any other change. `workflow_dispatch` is kept as a manual escape hatch (e.g. re-running after
# a transient infra failure without an empty commit).
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

env:
  MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
  POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}

jobs:
  # Reads the version this commit ships as before anything else runs, and re-runs the same gate
  # ci.yml applies to development — a push to master isn't guaranteed to be the exact commit that
  # gate last ran against (e.g. a merge commit).
  validate:
    name: Read the version and run the CI gate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read-version.outputs.version }}
      tag: ${{ steps.read-version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Read fuelio.versionName
        id: read-version
        run: |
          VERSION=$(grep '^fuelio.versionName=' gradle.properties | cut -d= -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - run: ./gradlew ktlintCheck

      - name: Run JVM tests
        run: |
          ./gradlew \
            :core:domain:testAndroidHostTest \
            :core:analytics:testAndroidHostTest \
            :data:testAndroidHostTest \
            :core:presentation:testAndroidHostTest \
            :androidApp:testDebugUnitTest

      - name: Verify screenshots
        run: ./gradlew :androidApp:verifyRoborazziDebug

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: release-ci-reports
          path: |
            **/build/reports/ktlint/**
            **/build/reports/tests/**
            androidApp/build/outputs/roborazzi/**
          if-no-files-found: ignore

  ios:
    name: iOS tests and archive
    needs: validate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Run Kotlin/Native tests
        run: |
          ./gradlew \
            :core:domain:iosSimulatorArm64Test \
            :core:analytics:iosSimulatorArm64Test \
            :data:iosSimulatorArm64Test \
            :core:presentation:iosSimulatorArm64Test

      - name: List available simulators
        run: xcrun simctl list devices available

      - name: Run Swift tests
        env:
          SIMULATOR_NAME: iPhone 17
        run: |
          xcodebuild test \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -destination "platform=iOS Simulator,name=${SIMULATOR_NAME},OS=latest" \
            -resultBundlePath build/iosApp.xcresult \
            -retry-tests-on-failure -test-iterations 2 \
            CODE_SIGNING_ALLOWED=NO

      # No signed .ipa: that needs an Apple Developer Program membership and provisioning profiles
      # this project doesn't have (ADR 0009). This proves the app packages cleanly for App Store
      # submission the moment real credentials exist, without pretending to ship one now.
      - name: Archive (unsigned, proves the app packages)
        run: |
          xcodebuild archive \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -archivePath build/Fuelio.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-release-test-results
          path: build/iosApp.xcresult

  android-release:
    name: Build signed Android release
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Restore keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > androidApp/release.keystore.jks
          cat > androidApp/keystore.properties <<EOF
          storeFile=release.keystore.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build signed release
        run: ./gradlew :androidApp:assembleRelease :androidApp:bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: fuelio-release-apk
          path: androidApp/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: fuelio-release-aab
          path: androidApp/build/outputs/bundle/release/*.aab
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [validate, ios, android-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fuelio-release-apk
          path: release-artifacts
      - uses: actions/download-artifact@v4
        with:
          name: fuelio-release-aab
          path: release-artifacts

      # Creates the tag on this push's commit (there is none yet — the version lives only in
      # gradle.properties) and either creates or updates the Release matching it, so re-pushing
      # master without bumping the version overwrites the previous build instead of failing on a
      # tag that already exists.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.validate.outputs.tag }}
          generate_release_notes: true
          files: release-artifacts/**

      # Firebase App Distribution keeps beta builds reachable without going through Google Play's
      # review, which is what testers on this project use before anything is public.
      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_APP_DISTRIBUTION_SERVICE_ACCOUNT }}
          groups: testers
          file: release-artifacts/*.apk
