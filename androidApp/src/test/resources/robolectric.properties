# Pinned below the app's compileSdk of 37: Compose's Robolectric idling strategy routes through
# Espresso, whose InputManagerEventInjectionStrategy calls InputManager.getInstance() — a method
# SDK 37 removed. Nothing the screenshot tests assert is SDK-specific, so rendering one level down
# costs no coverage.
sdk=36

# A plain Application instead of the manifest's AndroidApplication: the real one starts Koin, ANR
# WatchDog and Firebase, none of which a screenshot of a Composable needs, and Crashlytics throws
# outright when no FirebaseApp exists in the test process.
application=android.app.Application
